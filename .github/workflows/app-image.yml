name: App Image

# Builds and publishes the HOHE application image (server with the PWA embedded) to GHCR for
# every change to server/, web/ or the Dockerfile on main. Images are tagged by source commit
# and deployed by digest (proposal §11.2, decided in Phase 2): a linode-web1-config PR pins
# the exact digest, and the deploy script verifies the signature and the pin.
#
# Tags are "app-sha-<full commit>". The spike publishes "sha-<full commit>" to the same
# repository, so a commit that touches both never makes one workflow overwrite the other's tag.
# There are no semver tags, no "latest" and no GitHub releases: the SBOM and provenance are
# registry attestations bound to the digest (asserted below), as for the spike (POE-71).
# Every pushed image carries an SBOM and provenance attestation, a Grype CVE gate and a
# Cosign signature.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/app-*.yml"
  workflow_dispatch:

concurrency:
  group: app-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/app-ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write         # Cosign keyless (OIDC)
      security-events: write  # SARIF upload of the CVE scan
    env:
      IMAGE: ghcr.io/kevinpinscoe/hohe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No QEMU: the Go binary is cross-compiled in a $BUILDPLATFORM stage and the final
      # distroless stage runs nothing at build time.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=app-sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Fail on high or critical CVEs
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload the scan results
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-container

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      # The registry attestation is the record; this only asserts it is really there and
      # not empty, per platform (no GitHub release exists for commit-tagged images).
      - name: Assert the SBOM attestation
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$REF" --format '{{ json .SBOM }}' > sbom-raw.json
          echo "SBOM platforms:"; jq -r 'keys[]' sbom-raw.json
          for plat in linux/amd64 linux/arm64; do
            n=$(jq --arg p "$plat" '.[$p].SPDX.packages | length' sbom-raw.json)
            extra=$(jq --arg p "$plat" '[.[$p].AdditionalSPDXs[]?.packages | length] | add // 0' sbom-raw.json)
            echo "$plat: final stage $n packages, build stages $extra packages"
            [ "$n" -gt 0 ] || { echo "::error::empty SBOM for $plat"; exit 1; }
          done

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### HOHE application image"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Tags: \`${TAGS}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Deploy by digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
