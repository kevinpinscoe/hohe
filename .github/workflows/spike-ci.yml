name: Spike CI

# Tests for the HOHE Phase 2 spike (spike/). Also called by spike-image.yml before publishing.
on:
  pull_request:
    paths:
      - "spike/**"
      - ".github/workflows/spike-*.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: spike/go.mod
          cache: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # TZ=UTC mimics LibreWolf's privacy.resistFingerprinting: the planner day must not move.
      - name: client tests (TZ=UTC)
        env:
          TZ: UTC
        run: node --test 'web/test/*.test.mjs'
