name: App CI

# Tests for the HOHE Phase 3 application (server/ and the web/ client). Also called by the
# image workflow before publishing.
on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/app-*.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        # LibreWolf's resistFingerprinting reports a spoofed UTC+0 zone (Atlantic/Reykjavik);
        # the planner day must not depend on the process zone either way.
        tz: ["UTC", "Atlantic/Reykjavik", "America/Los_Angeles"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          TZ: ${{ matrix.tz }}
        run: go test -race -count=1 ./...

      - name: govulncheck
        if: matrix.tz == 'UTC'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the build names its version with git describe

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: npm ci
        run: npm ci

      - name: type-check, unit and rendering tests
        run: |
          npm run typecheck
          npm test

      - name: build
        run: npm run build

      - name: browser tests against the real server (Chromium)
        env:
          HOHE_E2E_CHANNEL: chromium
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
