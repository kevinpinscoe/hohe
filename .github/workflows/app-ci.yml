name: App CI

# Tests for the HOHE Phase 3 application (server/ and the web/ client). Also called by the
# image workflow before publishing.
on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/app-*.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        # LibreWolf's resistFingerprinting reports a spoofed UTC+0 zone (Atlantic/Reykjavik);
        # the planner day must not depend on the process zone either way.
        tz: ["UTC", "Atlantic/Reykjavik", "America/Los_Angeles"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          TZ: ${{ matrix.tz }}
        run: go test -race -count=1 ./...

      - name: govulncheck
        if: matrix.tz == 'UTC'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the build names its version with git describe

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: npm ci
        run: npm ci

      - name: type-check, unit and rendering tests
        run: |
          npm run typecheck
          npm test

      - name: build
        run: npm run build

      - name: browser tests against the real server (Chromium)
        env:
          HOHE_E2E_CHANNEL: chromium
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Upload browser-test results on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-results
          path: web/test-results/
          retention-days: 7

  image-build:
    # The Dockerfile builds and the result runs (amd64 only, not pushed). Publishing,
    # attestations, the CVE gate and signing happen in app-image.yml after merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: hohe:ci
          build-args: |
            VERSION=${{ github.sha }}

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm hohe:ci --version | grep -q "${GITHUB_SHA}"
          mkdir -p "$RUNNER_TEMP/data" && chmod 777 "$RUNNER_TEMP/data"
          hash=$(printf 'ci smoke password\n' | docker run --rm -i hohe:ci hash-password)
          printf '{"listen":":8080","dataDir":"/data","persistent":false,"loginPasswordBcrypt":"%s","captureTokens":[],"secureCookies":false}' "$hash" > "$RUNNER_TEMP/config.json"
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:8080:8080 \
            -v "$RUNNER_TEMP/config.json:/config/config.json:ro" -v "$RUNNER_TEMP/data:/data" hohe:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8080/sw.js | grep -q "${GITHUB_SHA}"
          docker stop smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = 0
